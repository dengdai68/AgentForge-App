<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · AgentForge</title><link rel="stylesheet" href="/login.css"></head>
<body>
  <main class="login-card">
    <div class="brand">AgentForge <span>AI TEAM OS</span></div>
    <h1>登录工作区</h1>
    <p class="intro">正在检查工作区…</p>
    <form id="login-form" hidden>
      <label for="username">用户名</label><input id="username" name="username" autocomplete="username" maxlength="64" required autofocus>
      <label for="password">密码</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><button id="toggle-password" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div>
      <p id="login-error" role="alert" aria-live="polite"></p>
      <button class="submit" type="submit">登录</button>
    </form>
    <section id="setup-guidance" class="setup-guidance" hidden aria-live="polite">
      <h2>此服务尚未设置管理员</h2>
      <p id="desktop-setup-guidance" hidden>请在客户端菜单选择「导航 → 首页 / 重新连接」（⌘0），继续在应用内创建管理员。无需终端命令或项目目录；如仍无法打开，请退出并重新启动客户端。</p>
      <a href="/login">设置完成后重新检查</a>
    </section>
    <footer>单管理员工作区 · 安全会话</footer>
  </main>
  <script src="/login.js" defer></script>
</body></html>
